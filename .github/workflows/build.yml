name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Win10WebmCut/Win10WebmCut.csproj
      - name: Build
        run: dotnet build src/Win10WebmCut/Win10WebmCut.csproj --configuration Release --no-restore
      - name: Publish self-contained
        run: dotnet publish src/Win10WebmCut/Win10WebmCut.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Win10WebmCut-win-x64
          path: artifacts/win-x64/
